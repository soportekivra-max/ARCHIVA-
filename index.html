<script>
/* ARCHIVA en internet: datos en Supabase, acceso solo con usuario y contraseña. */
/* Cambia false por true cuando termines de subir: se ocultan Subir, editar y borrar para todos. */
const SOLO_LECTURA = false;
/* true = solo el administrador puede descargar tablas y ver columnas completas. Pon false para permitirlo a todos. */
const SOLO_ADMIN_EXPORTAR = true;
(() => {
  'use strict';
  const sb = window.supabase.createClient('https://csvvhvstkzkypvznaluj.supabase.co', 'sb_publishable_sKnog8uqFcSyjaLhappH6Q_cE3oxRFP');
  window.__sb = sb;
  const uid = () => Array.from(crypto.getRandomValues(new Uint8Array(14)), (b) => (b % 36).toString(36)).join('') + Date.now().toString(36).slice(-6);
  let admin = false;
  const listeners = [];
  const query = async (q) => {
    const rows = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await sb.from('docs').select('id,data').eq('coleccion', q.name).order('id').range(from, from + 999);
      if (error) throw error;
      rows.push(...data);
      if (data.length < 1000) break;
    }
    if (q.order) {
      const [f, dir] = q.order;
      rows.sort((a, b) => { const x = a.data[f], y = b.data[f]; return (x > y ? 1 : x < y ? -1 : 0) * (dir === 'desc' ? -1 : 1); });
    }
    return rows.slice(0, q.lim);
  };
  const snap = (rows) => ({ docs: rows.map((r) => ({ id: r.id, data: () => r.data })) });
  const fire = async (l) => { try { l.cb(snap(await query(l.q))); } catch (e) { if (l.err) l.err(e); } };
  const notify = (name) => { listeners.filter((l) => l.q.name === name).forEach(fire); };
  const collection = (name) => {
    const q = { name, order: null, lim: Infinity };
    const api = {
      orderBy(f, d) { q.order = [f, d || 'asc']; return api; },
      limit(n) { q.lim = n; return api; },
      async get() { return snap(await query(q)); },
      onSnapshot(cb, err) { const l = { q: { ...q }, cb, err }; listeners.push(l); fire(l); return () => { const i = listeners.indexOf(l); if (i >= 0) listeners.splice(i, 1); }; },
      doc(id) {
        const did = id || uid();
        const get = async () => { const { data, error } = await sb.from('docs').select('data').eq('coleccion', name).eq('id', did).maybeSingle(); if (error) throw error; return data; };
        const put = async (data) => { const { error } = await sb.from('docs').upsert({ coleccion: name, id: did, data }); if (error) throw error; notify(name); };
        return {
          id: did,
          async get() { const r = await get(); return { exists: !!r, id: did, data: () => (r ? r.data : undefined) }; },
          async set(data) { await put({ ...data }); },
          async update(data) { const r = await get(); await put({ ...((r && r.data) || {}), ...data }); },
          async delete() { const { error } = await sb.from('docs').delete().eq('coleccion', name).eq('id', did); if (error) throw error; notify(name); }
        };
      }
    };
    return api;
  };
  const assets = {
    async upload(file, opt) {
      const id = uid();
      const { error } = await sb.storage.from('archiva').upload(id, file, { contentType: (opt && opt.type) || file.type || 'application/octet-stream' });
      if (error) throw error;
      return { id };
    },
    async delete(id) { const { error } = await sb.storage.from('archiva').remove([id]); if (error) throw error; },
    async list() { return { assets: [], usage: { bytes: 0, maxBytes: 0 } }; }
  };
  const downloads = {
    async save({ filename, data }) {
      const url = URL.createObjectURL(data);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.style.display = 'none';
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
    }
  };
  const ready = new Promise((resolve) => {
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;z-index:1000;background:var(--color-bg,#0b0f1a);color:var(--color-text,#fff);display:flex;align-items:center;justify-content:center;padding:24px';
    const inp = 'padding:14px;border-radius:10px;border:1px solid #556;background:transparent;color:inherit;font-size:16px';
    box.innerHTML = `<form style="width:100%;max-width:360px;display:grid;gap:12px"><h1 style="margin:0">ARCHIVA</h1><p style="margin:0;opacity:.7">Inicia sesión para continuar</p>
      <input id="lg-e" type="email" autocomplete="username" placeholder="Correo" required style="${inp}">
      <input id="lg-p" type="password" autocomplete="current-password" placeholder="Contraseña" required style="${inp}">
      <button class="button button--primary" type="submit" id="lg-b">Entrar</button><p id="lg-m" style="margin:0;color:#ff7b7b"></p></form>`;
    const finish = async () => {
      try { const { data } = await sb.rpc('es_admin'); admin = data === true; } catch { admin = false; }
      window.__isAdmin = admin; box.remove(); resolve();
    };
    box.querySelector('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const m = box.querySelector('#lg-m'), b = box.querySelector('#lg-b');
      b.disabled = true; m.textContent = '';
      const { error } = await sb.auth.signInWithPassword({ email: box.querySelector('#lg-e').value.trim(), password: box.querySelector('#lg-p').value });
      b.disabled = false;
      if (error) { m.textContent = 'Correo o contraseña incorrectos.'; return; }
      finish();
    });
    document.body.appendChild(box);
    sb.auth.getSession().then(({ data }) => { if (data && data.session) finish(); });
  });
  window.claude = { use: async (n) => { await ready; return n === 'db' ? { collection } : n === 'assets' ? (admin && !SOLO_LECTURA ? assets : null) : n === 'downloads' ? downloads : null; } };
})();

function confirmDialog({ title, body, confirmLabel, danger = true }) {
  return new Promise((resolve) => {
    const root = $('#dialog-root');
    root.innerHTML = `<div class="confirm-dialog" role="presentation">
      <div class="confirm-dialog__panel" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-body">
        <div class="confirm-dialog__icon">${icon(danger ? 'trash' : 'info')}</div>
        <h2 class="confirm-dialog__title" id="dlg-title">${esc(title)}</h2>
        <p class="confirm-dialog__description" id="dlg-body">${esc(body)}</p>
        <div class="confirm-dialog__actions">
          <button class="button button--secondary" type="button" data-r="0">Cancelar</button>
          <button class="button ${danger ? 'button--danger' : 'button--primary'}" type="button" data-r="1">${esc(confirmLabel)}</button>
        </div></div></div>`;
    const prev = document.activeElement;
    const close = (v) => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); prev?.focus?.(); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') close(false); };
    document.addEventListener('keydown', onKey);
    root.querySelector('.confirm-dialog').addEventListener('click', (e) => {
      const b = e.target.closest('[data-r]');
      if (b) close(b.dataset.r === '1');
      else if (e.target.classList.contains('confirm-dialog')) close(false);
    });
    root.querySelector('[data-r="0"]').focus();
  });
}

function passFilters(f) {
  const { kind, date, tag, size, status, table } = S.filters;
  if (S.view === 'favorites' && !f.fav) return false;
  if (S.view === 'recent' && Date.now() - new Date(f.createdAt) > 30 * 864e5) return false;
  if (kind && (f.kind || 'generic') !== kind) return false;
  if (tag && !(f.tags || []).includes(tag)) return false;
  if (table && f.id !== table) return false;
  if (status && effStatus(f) !== status) return false;
  if (size) { const b = f.size || 0; if (size === 's' && b >= MiB) return false; if (size === 'm' && (b < MiB || b > 10 * MiB)) return false; if (size === 'l' && b <= 10 * MiB) return false; }
  if (date) {
    const d = new Date(f.createdAt), now = new Date();
    if (date === 'today' && d.toDateString() !== now.toDateString()) return false;
    if (date === '7' && now - d > 7 * 864e5) return false;
    if (date === '30' && now - d > 30 * 864e5) return false;
    if (date === 'year' && d.getFullYear() !== now.getFullYear()) return false;
  }
  return true;
}
function computeResults() {
  const terms = norm(S.q).split(/\s+/).filter(Boolean);
  const out = [];
  for (const f of S.files) {
    if (!passFilters(f)) continue;
    if (!terms.length) { out.push({ f }); continue; }
    const meta = norm([f.name, f.ext, KIND_LABEL[f.kind], (f.tags || []).join(' '), f.notes].join(' '));
    const content = S.contents ? (S.contents[f.id]?.n || '') : '';
    let inContent = false, ok = true;
    for (const t of terms) {
      if (meta.includes(t)) continue;
      if (content.includes(t)) { inContent = true; continue; }
      ok = false; break;
    }
    if (ok) out.push({ f, snippet: inContent ? makeSnippet(f.id, terms) : '' });
  }
  const by = {
    recent: (a, b) => (b.f.createdAt || '').localeCompare(a.f.createdAt || ''),
    oldest: (a, b) => (a.f.createdAt || '').localeCompare(b.f.createdAt || ''),
    az: (a, b) => (a.f.name || '').localeCompare(b.f.name || '', 'es', { numeric: true }),
    za: (a, b) => (b.f.name || '').localeCompare(a.f.name || '', 'es', { numeric: true }),
    big: (a, b) => (b.f.size || 0) - (a.f.size || 0),
    small: (a, b) => (a.f.size || 0) - (b.f.size || 0)
  }[S.sort];
  return out.sort(by);
}
function makeSnippet(id, terms) {
  const c = S.contents[id]; if (!c) return '';
  const t = terms.find((x) => c.n.includes(x)); if (!t) return '';
  const i = c.n.indexOf(t);
  const src = c.n.length === c.raw.length ? c.raw : c.n; // same length: indices line up with the original text
  const a = Math.max(0, i - 60), b = Math.min(src.length, i + t.length + 80);
  return (a > 0 ? '…' : '') + esc(src.slice(a, i)) + '<mark>' + esc(src.slice(i, i + t.length)) + '</mark>' + esc(src.slice(i + t.length, b)) + (b < src.length ? '…' : '');
}
function highlight(text) {
  const terms = norm(S.q).split(/\s+/).filter(Boolean);
  const n = norm(text);
  if (!terms.length || n.length !== String(text).length) return esc(text);
  const ranges = [];
  for (const t of terms) { let i = n.indexOf(t); while (i !== -1) { ranges.push([i, i + t.length]); i = n.indexOf(t, i + t.length); } }
  if (!ranges.length) return esc(text);
  ranges.sort((a, b) => a[0] - b[0]);
  let out = '', pos = 0;
  for (const [a, b] of ranges) { if (a < pos) continue; out += esc(text.slice(pos, a)) + '<mark>' + esc(text.slice(a, b)) + '</mark>'; pos = b; }
  return out + esc(text.slice(pos));
}

}

        <button class="button button--secondary" type="button" data-delete="${f.id}">${icon('trash', 18)}Eliminar</button>` : ''}
      </div></div>`;
  const rows = [
    ['Nombre', esc(f.name)], ['Tipo', `${KIND_LABEL[f.kind] || 'Archivo'}${f.ext ? ' (.' + esc(f.ext) + ')' : ''}`],
    ['Tamaño', `${fmtSize(f.size)} <span class="text-muted">(${NF.format(f.size || 0)} bytes)</span>`],
    ['Subido', fmtDate(f.createdAt, true)], ['Actualizado', fmtDate(f.updatedAt, true)],
    ['Estado', effStatus(f) === 'processing' ? 'Procesándose' : 'Disponible'],
    ['Búsqueda por contenido', f.hasText ? `Sí · ${NF.format(f.textChars || 0)} caracteres indexados` : effStatus(f) === 'processing' ? 'Pendiente' : (f.size > readLimit(f.kind, f.ext) ? 'No (archivo muy grande para leerlo en el navegador)' : 'No (sin texto legible)')],
    ['ID', `<span class="copy-row"><code>${esc(f.id)}</code><button class="button button--icon button--small" type="button" data-copy="${esc(f.id)}" aria-label="Copiar ID">${icon('copy', 16)}</button></span>`]
  ];
  $('#meta').innerHTML = rows.map(([k, v]) => `<div class="file-details__metadata-row"><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  const tags = f.tags || [];
  const oldTag = $('#tag-input'); const keepTag = oldTag ? { v: oldTag.value, f: document.activeElement === oldTag } : null;
  $('#tags').innerHTML = `<div class="tag-editor__list">${tags.length ? tags.map((t) => `<span class="tag-editor__tag">${esc(t)}${canEdit() ? `<button class="tag-editor__remove" type="button" data-untag="${esc(t)}" aria-label="Quitar etiqueta ${esc(t)}">${icon('x', 14)}</button>` : ''}</span>`).join('') : '<span class="text-muted">Sin etiquetas todavía</span>'}</div>
    ${canEdit() ? `<form class="tag-editor__form" id="tag-form"><label class="visually-hidden" for="tag-input">Nueva etiqueta</label>
      <input class="tag-editor__input" id="tag-input" list="tag-suggest" maxlength="40" placeholder="Ej. facturas, cliente, 2026" autocomplete="off">
      <datalist id="tag-suggest">${allTags().filter((t) => !tags.includes(t)).map((t) => `<option value="${esc(t)}"></option>`).join('')}</datalist>
      <button class="button button--secondary" type="submit">${icon('plus', 18)}Añadir</button></form>` : ''}`;
  const newTag = $('#tag-input'); if (newTag && keepTag) { newTag.value = keepTag.v; if (keepTag.f) newTag.focus(); }
}
async function loadPreview(f) {
  const box = $('#preview'); if (!box) return;
  box.className = 'file-details__preview';
  box.innerHTML = `<div class="empty-state"><p class="empty-state__description">${NF.format(f.rows || 0)} filas guardadas en la base de datos.</p></div>`;
}

/* Writes */
async function patch(f, data, okMsg) {
  try { await S.db.collection('files').doc(f.id).update({ ...data, updatedAt: new Date().toISOString() }); if (okMsg) toast(okMsg); return true; }
  catch { toast('No se pudieron guardar los cambios', 'Revisa tu conexión e inténtalo de nuevo.', 'error'); return false; }
}
function scheduleNotes(f, value) {
  S.notesPending = { f, value };
  const st = $('#notes-status');
  if (st) { st.className = 'notes-editor__status'; st.textContent = 'Guardando…'; }
  clearTimeout(S.notesTimer);
  S.notesTimer = setTimeout(flushNotes, 800);
}
async function flushNotes() {
  clearTimeout(S.notesTimer);
  const p = S.notesPending; if (!p) return;
  S.notesPending = null;
  try {
    await S.db.collection('files').doc(p.f.id).update({ notes: p.value, updatedAt: new Date().toISOString() });
    const st = $('#notes-status'); if (st && S.fileId === p.f.id) { st.className = 'notes-editor__status notes-editor__status--saved'; st.textContent = 'Guardado'; }
  } catch {
    const st = $('#notes-status');
    if (st && S.fileId === p.f.id) { st.className = 'notes-editor__status notes-editor__status--error'; st.innerHTML = 'No se pudo guardar. <button class="button button--secondary button--small" type="button" id="notes-retry">Reintentar</button>'; }
    S.notesFailed = p;
  }
}
async function removeFile(f) {
  const ok = await confirmDialog({ title: `¿Eliminar “${f.name}”?`, body: 'Se borrarán el archivo, su ficha, etiquetas y notas. Esta acción no se puede deshacer.', confirmLabel: 'Eliminar' });
  if (!ok) return;
  try {
    await borrarFilas(f.name, f.rows || 0);
    await S.db.collection('files').doc(f.id).delete();
    try { await S.db.collection('contents').doc(f.id).delete(); } catch { /* index entry is optional */ }
    for (const id of partIds(f)) { try { await S.assets.delete(id); } catch { /* orphan part: the record is already gone */ } }
    if (S.contents) delete S.contents[f.id];
    toast('Archivo eliminado', f.name);
    refreshUsageSoon();
    if (S.view === 'detail') go(S.from && S.from !== 'detail' ? S.from : 'library');
  } catch { toast('No se pudo eliminar', 'Inténtalo de nuevo en un momento.', 'error'); }
}

/* ---------- Buscar columna (anadido) ---------- */
const colNorm = (x) => String(x ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const colPause = () => new Promise((r) => setTimeout(r, 0));
const colTables = () => S.files.filter((f) => effStatus(f) === 'available' && passFilters(f));
let colRun = 0;
let colRes = null;
let colShown = 300;

function paintColCard() {
  const el = $('#colcard'); if (!el) return;
  const q = S.q.trim();
  const n = (S.ready && !S.dbMissing && !S.dbError) ? colTables().length : 0;
  const show = q.length >= 2 && n > 0;
  const rs = $('#results'), sm = $('#summary');
  if (rs) rs.hidden = show;
  if (sm) sm.hidden = show;
  if (!show) { el.innerHTML = ''; return; }
  el.innerHTML = `<div style="border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-surface);padding:var(--space-4);margin:0 0 var(--space-4)">
    <div style="font-weight:600;margin-bottom:var(--space-2)">«${esc(q)}»</div>
    <div style="color:var(--color-text-muted);margin-bottom:var(--space-3)">Busca el dato en todas las filas de tus ${NF.format(n)} ${n === 1 ? 'tabla' : 'tablas'}.</div>
    <button class="button button--primary button--full" type="button" data-val="${esc(q)}">Buscar en todas las filas</button>
    <button class="button button--secondary button--full" type="button" data-col="${esc(q)}" style="margin-top:var(--space-2)">Ver como columna</button></div>`;
}

async function loadColumn(q) {
  const sb = window.__sb, k = colNorm(q);
  let c = COLS[k];
  if (!c && k.length >= 3) { const m = Object.keys(COLS).find((a) => a.includes(k)); c = m && COLS[m]; }
  const res = { values: [], names: new Set(), hit: colTables().length, skipped: 0, headers: Object.values(LABEL), total: 0 };
  if (!c) return res;
  res.names.add(LABEL[c]);
  const cnt = await sb.from('personas').select(c, { count: 'exact', head: true }).not(c, 'is', null);
  if (cnt.error) throw cnt.error;
  res.total = cnt.count || 0;
  const get = async (a) => { const { data, error } = await sb.from('personas').select(c).not(c, 'is', null).order('id').range(a, a + 999); if (error) throw error; return data.map((r) => r[c]); };
  res.values = await get(0);
  res.all = async () => { while (res.values.length < res.total) res.values.push(...await get(res.values.length)); };
  return res;
}

const colShell = (inner) => `<div style="position:fixed;inset:0;z-index:100;overflow:auto;background:var(--color-bg);color:var(--color-text);padding:calc(var(--space-4) + env(safe-area-inset-top,0px)) var(--space-4) calc(var(--space-6) + env(safe-area-inset-bottom,0px))">
  <div style="max-width:720px;margin:0 auto"><button class="button button--secondary" type="button" data-colx="1">Cerrar</button>${inner}</div></div>`;

function paintColResult() {
  const root = $('#dialog-root'); const res = colRes; if (!root || !res) return;
  const label = [...res.names].join(' / ');
  const shown = res.values.slice(0, colShown);
  const top = root.firstElementChild ? root.firstElementChild.scrollTop : 0;
  root.innerHTML = colShell(`
    <h2 style="margin:var(--space-4) 0 var(--space-2)">Columna «${esc(label)}»</h2>
    <p style="color:var(--color-text-muted);margin:0 0 var(--space-4)">${NF.format((res.total || res.values.length))} valores en ${NF.format(res.hit)} ${res.hit === 1 ? 'tabla' : 'tablas'}${res.skipped ? ` · ${res.skipped} no se pudieron leer` : ''}</p>
    <button class="button button--primary button--full" type="button" data-colsave="1">Guardar columna (CSV)</button>
    <table style="width:100%;border-collapse:collapse;margin-top:var(--space-4)"><tbody>
    ${shown.map((v, i) => `<tr style="border-top:1px solid var(--color-border)"><td style="padding:8px 8px 8px 0;color:var(--color-text-muted);width:1%;white-space:nowrap">${i + 1}</td><td style="padding:8px 0;word-break:break-word">${esc(v)}</td></tr>`).join('')}
    </tbody></table>
    ${(res.total || res.values.length) > shown.length ? `<button class="button button--secondary button--full" type="button" data-colmore="1" style="margin-top:var(--space-4)">Mostrar 300 más · quedan ${NF.format((res.total || res.values.length) - shown.length)}</button>` : ''}`);
  if (root.firstElementChild) root.firstElementChild.scrollTop = top;
}

async function openColumn(q) {
  if (SOLO_ADMIN_EXPORTAR && !window.__isAdmin) { toast('Solo el administrador puede ver columnas completas', '', 'warning'); return; }
  const my = ++colRun;
  const root = $('#dialog-root');
  root.innerHTML = colShell(`<h2 style="margin:var(--space-4) 0 var(--space-2)">Columna «${esc(q)}»</h2><p id="col-prog" style="color:var(--color-text-muted)">Preparando…</p><p style="color:var(--color-text-muted)">Puede tardar un poco. No cierres esta pantalla.</p>`);
  let res;
  try {
    res = await loadColumn(q, () => colRun === my, (i, n) => { const p = $('#col-prog'); if (p) p.textContent = `Leyendo tabla ${i} de ${n}…`; });
  } catch {
    if (colRun !== my) return;
    root.innerHTML = colShell(`<h2 style="margin:var(--space-4) 0 var(--space-2)">No se pudo leer</h2><p style="color:var(--color-text-muted)">Hubo un problema leyendo las tablas. Intenta de nuevo.</p>`);
    return;
  }
  if (colRun !== my || !res) return;
  if (!res.values.length) {
    root.innerHTML = colShell(`<h2 style="margin:var(--space-4) 0 var(--space-2)">No encontré esa columna</h2>
      <p style="color:var(--color-text-muted)">Ninguna tabla tiene una columna llamada «${esc(q)}».${res.headers.length ? ' Las columnas disponibles son:' : ''}</p>
      ${res.headers.length ? `<p>${res.headers.map((h) => esc(h)).join(' · ')}</p>` : ''}`);
    return;
  }
  colRes = res; colShown = 300;
  paintColResult();
}

async function loadValue(q) {
  const terms = colNorm(q).split(/\s+/).filter(Boolean);
  let qb = window.__sb.from('personas').select('*', { count: 'exact' });
  if (Object.values(S.filters).some(Boolean)) qb = qb.in('archivo', colTables().map((f) => f.name));
  for (const t of terms) qb = qb.ilike('busqueda', '%' + t.replace(/[\\%_]/g, '\\$&') + '%');
  const { data, count, error } = await qb.order('id').limit(200);
  if (error) throw error;
  return { total: count || 0, skipped: 0, matches: data.map((r) => ({ file: r.archivo || 'tabla', row: r.fila || r.id, cells: COLORD.filter((c) => r[c]).map((c) => [LABEL[c], r[c]]) })) };
}

async function openValue(q) {
  const my = ++colRun;
  const root = $('#dialog-root');
  const head = `<h2 style="margin:var(--space-4) 0 var(--space-2)">Valor «${esc(q)}»</h2>`;
  root.innerHTML = colShell(head + `<p id="col-prog" style="color:var(--color-text-muted)">Preparando…</p><p style="color:var(--color-text-muted)">Puede tardar un poco. No cierres esta pantalla.</p>`);
  let res;
  try {
    res = await loadValue(q, () => colRun === my, (i, n) => { const p = $('#col-prog'); if (p) p.textContent = `Leyendo tabla ${i} de ${n}… (solo la primera vez)`; });
  } catch {
    if (colRun !== my) return;
    root.innerHTML = colShell(`<h2 style="margin:var(--space-4) 0 var(--space-2)">No se pudo leer</h2><p style="color:var(--color-text-muted)">Hubo un problema leyendo las tablas. Intenta de nuevo.</p>`);
    return;
  }
  if (colRun !== my || !res) return;
  if (!res.total) {
    root.innerHTML = colShell(head + `<p style="color:var(--color-text-muted)">No encontré «${esc(q)}» en ninguna fila de tus tablas${res.skipped ? ` (${res.skipped} no se pudieron leer)` : ''}.</p>`);
    return;
  }
  root.innerHTML = colShell(head + `<p style="color:var(--color-text-muted);margin:0 0 var(--space-4)">${NF.format(res.total)} ${res.total === 1 ? 'fila coincide' : 'filas coinciden'}${res.total > res.matches.length ? ` · se muestran las primeras ${res.matches.length}` : ''}${res.skipped ? ` · ${res.skipped} no se pudieron leer` : ''}</p>
    ${res.matches.map((m) => `<div style="border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-surface);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-3)">
      <div style="color:var(--color-text-muted);margin-bottom:var(--space-2)">${esc(m.file)} · fila ${NF.format(m.row)}</div>
      ${m.cells.map(([h, v]) => `<div style="display:flex;gap:var(--space-3);padding:2px 0"><span style="color:var(--color-text-muted);min-width:96px">${esc(h)}</span><span style="word-break:break-word">${esc(v)}</span></div>`).join('')}</div>`).join('')}`);
}

async function saveColumn() {
  const res = colRes; if (!res) return;
  if (res.all) { toast('Preparando…', 'Descargando todos los valores', 'info'); try { await res.all(); } catch { toast('No se pudo', 'Intenta de nuevo.', 'error'); return; } }
  if (!S.downloads) { toast('La descarga no está disponible aquí', 'Tu navegador no permite guardar desde aquí.', 'warning'); return; }
  const q = (v) => { const t = String(v ?? ''); return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const label = [...res.names].join(' - ');
  const blob = new Blob(['\uFEFF', q(label) + '\n', res.values.map(q).join('\n'), '\n'], { type: 'text/csv' });
  const filename = ('columna_' + label).replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_').slice(0, 60) + '.csv';
  S.downloads.save({ filename, data: blob }).catch(() => { toast('No se guardó', 'Intenta de nuevo.', 'error'); });
}

document.addEventListener('click', (e) => {
  const g = e.target.closest('#q-go'); if (!g) return;
  const q = S.q.trim();
  if (q.length >= 2 && colTables().length) openValue(q); else { const i = $('#q'); if (i) i.focus(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || !e.target || e.target.id !== 'q') return;
  const q = S.q.trim();
  if (q.length >= 2 && colTables().length) { e.preventDefault(); e.target.blur(); openValue(q); }
});

document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-col],[data-val],[data-colx],[data-colsave],[data-colmore]');
  if (!b) return;
  if (b.dataset.colx) { colRun++; $('#dialog-root').innerHTML = ''; return; }
  if (b.dataset.colsave) { saveColumn(); return; }
  if (b.dataset.colmore) { colShown += 300; if (colRes && colRes.all && colRes.values.length < colShown) { const my = colRes; try { while (my.values.length < colShown && my.values.length < my.total) my.values.push(...(await (async () => { const sb = window.__sb, c = COLORD.find((x) => LABEL[x] === [...my.names][0]); const { data } = await sb.from('personas').select(c).not(c, 'is', null).order('id').range(my.values.length, my.values.length + 999); return data.map((r) => r[c]); })())); } catch { toast('No se pudo cargar más', 'Revisa tu conexión.', 'error'); } } paintColResult(); return; }
  if (b.dataset.val) { openValue(b.dataset.val); return; }
  if (b.dataset.col) openColumn(b.dataset.col);
});

/* ---------- Events ---------- */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button, [data-nav]');
  if (!t) return;
  const d = t.dataset;
  if (d.nav) { if (d.nav === 'upload' && S.view === 'upload') $('#file-input').click(); else go(d.nav); return; }
  if (d.open) { go('detail', d.open); return; }
  if ('back' in d) { go(S.from && S.from !== 'detail' ? S.from : 'library'); return; }
  if (d.layout) { S.layout = d.layout; store.set('layout', S.layout); document.querySelectorAll('[data-layout]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.layout === S.layout))); renderResults(); return; }
  if (d.unfilter) { S.filters[d.unfilter] = ''; S.page = 1; const s = $('#f-' + d.unfilter); if (s) s.value = ''; renderResults(); return; }
  if ('clearFilters' in d) { for (const k in S.filters) S.filters[k] = ''; S.page = 1; document.querySelectorAll('[data-filter]').forEach((s) => { s.value = ''; }); renderResults(); return; }
  if (d.fav) { const f = S.byId.get(d.fav); if (f && canEdit()) patch(f, { fav: !f.fav }); return; }
  if (d.download) { const f = S.byId.get(d.download); if (f) { t.disabled = true; await download(f); t.disabled = false; } return; }
  if (d.delete) { const f = S.byId.get(d.delete); if (f) removeFile(f); return; }
  if (d.untag) { const f = S.byId.get(S.fileId); if (f) patch(f, { tags: (f.tags || []).filter((x) => x !== d.untag) }); return; }
  if (d.copy) { try { await navigator.clipboard.writeText(d.copy); toast('ID copiado'); } catch { const c = t.parentElement.querySelector('code'); const r = document.createRange(); r.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selecciona y copia el ID', '', 'info'); } return; }
  if (d.cancel) { S.queue = S.queue.filter((q) => !(q.qid === d.cancel && q.status === 'queued')); renderQueue(); renderNav(); return; }
  if (d.retry) { const it = S.queue.find((q) => q.qid === d.retry); if (it) { it.status = 'queued'; it.error = ''; paintItem(it); pump(); } return; }
  if (d.dismiss) { S.queue = S.queue.filter((q) => q.qid !== d.dismiss); renderQueue(); renderNav(); return; }
  switch (t.id) {
    case 'menu-btn': setSidebar(!$('#sidebar').classList.contains('sidebar--open')); break;
    case 'm-upload': go('upload'); break;
    case 'pick': $('#file-input').click(); break;
    case 'q-clear': case 'q-clear-2': S.q = ''; S.page = 1; { const q = $('#q'); if (q) { q.value = ''; q.focus(); } } paintSearchHint(); renderResults(); break;
    case 'more': S.page++; renderResults(); break;
    case 'retry-all': S.queue.forEach((q) => { if (q.status === 'error' && q.retryable) { q.status = 'queued'; q.error = ''; } }); renderQueue(); pump(); break;
    case 'clear-done': S.queue = S.queue.filter((q) => q.status !== 'done'); renderQueue(); renderNav(); break;
    case 'notes-retry': if (S.notesFailed) { S.notesPending = S.notesFailed; S.notesFailed = null; flushNotes(); } break;
  }
});
$('#backdrop').addEventListener('click', () => setSidebar(false));
const onSearch = debounce(() => { S.page = 1; renderResults(); }, 180);
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') {
    const had = !!S.q; S.q = e.target.value;
    if (had !== !!S.q) paintSearchHint();
    if (S.q.trim()) ensureContents();
    onSearch();
  } else if (e.target.id === 'notes') {
    const f = S.byId.get(S.fileId); if (!f || !canEdit()) return;
    $('#notes-count').textContent = `${e.target.value.length} / 2000`;
    scheduleNotes(f, e.target.value);
  }
});
document.addEventListener('change', (e) => {
  if (e.target.dataset.filter) { S.filters[e.target.dataset.filter] = e.target.value; S.page = 1; renderResults(); }
  else if (e.target.id === 'sort') { S.sort = e.target.value; store.set('sort', S.sort); renderResults(); }
  else if (e.target.id === 'file-input') { addFiles(e.target.files); e.target.value = ''; }
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'tag-form') return;
  e.preventDefault();
  const input = $('#tag-input');
  const tag = input.value.trim().replace(/\s+/g, ' ').toLowerCase();
  const f = S.byId.get(S.fileId);
  if (!tag || !f) return;
  const tags = f.tags || [];
  if (tags.includes(tag)) { input.value = ''; return; }
  if (tags.length >= 20) { toast('Máximo 20 etiquetas por archivo', '', 'warning'); return; }
  input.value = '';
  patch(f, { tags: [...tags, tag] }).then(() => $('#tag-input')?.focus());
});
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (!['library', 'favorites', 'recent'].includes(S.view)) go('library');
    $('#q')?.focus();
  }
  if (e.key === 'Escape' && $('#sidebar').classList.contains('sidebar--open')) setSidebar(false);
});
let dragDepth = 0;
document.addEventListener('dragenter', (e) => {
  if (!canEdit() || ![...(e.dataTransfer?.types || [])].includes('Files')) return;
  e.preventDefault(); dragDepth++;
  const dz = $('#dropzone');
  if (dz) { dz.classList.add('upload-dropzone--drag-active'); $('#dz-title').textContent = 'Suelta las tablas para añadirlas'; }
});
document.addEventListener('dragover', (e) => { if (canEdit() && [...(e.dataTransfer?.types || [])].includes('Files')) e.preventDefault(); });
document.addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) { const dz = $('#dropzone'); if (dz) { dz.classList.remove('upload-dropzone--drag-active'); $('#dz-title').textContent = 'Arrastra tus tablas aquí'; } }
});
document.addEventListener('drop', (e) => {
  if (!canEdit() || !e.dataTransfer?.files?.length) return;
  e.preventDefault(); dragDepth = 0;
  addFiles(e.dataTransfer.files);
});
window.addEventListener('beforeunload', () => { flushNotes(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) flushNotes(); });
window.addEventListener('pagehide', () => { flushNotes(); });

/* ---------- Boot ---------- */
$('#brand-mark').innerHTML = icon('logo', 20);
$('#brand-mark-m').innerHTML = icon('logo', 20);
$('#menu-btn').innerHTML = icon('menu');
$('#home-btn').innerHTML = icon('back', 24);
$('#m-upload').innerHTML = icon('plus', 20) + 'Subir';
render();

(async function connect() {
  const use = (n) => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [db, assets, downloads] = await Promise.all([use('db'), use('assets'), use('downloads')]);
  S.db = db; S.assets = assets; S.downloads = downloads;
  if (!db) { S.dbMissing = true; S.ready = true; render(); return; }
  render();
  refreshUsage();
  db.collection('files').orderBy('createdAt', 'desc').limit(1000).onSnapshot((snap) => {
    S.files = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    S.byId = new Map(S.files.map((f) => [f.id, f]));
    if (snap.docs.length >= 1000 && !S.warnedLimit) { S.warnedLimit = true; toast('Demasiadas tablas', 'Solo se muestran las 1000 más recientes.', 'warning'); }
    const first = !S.ready;
    S.ready = true;
    renderNav();
    if (S.view === 'detail') {
      const f = S.byId.get(S.fileId);
      if (!f || first || !$('#detail-head')) renderDetail();
      else { paintDetailParts(f); loadPreview(f); }
    } else if (S.view !== 'upload') {
      if (first) renderLibrary(); else { renderResults(); refreshTagFilter(); }
    }
  }, () => { S.dbError = true; S.ready = true; render(); });
})();
function refreshTagFilter() {
  const sel = $('#f-tag'); if (!sel) return;
  const tags = allTags();
  FILTER_DEFS.tag.opts = tags.map((t) => [t, t]);
  const cur = S.filters.tag;
  sel.innerHTML = `<option value="">${FILTER_DEFS.tag.all}</option>` + tags.map((t) => `<option value="${esc(t)}"${t === cur ? ' selected' : ''}>${esc(t)}</option>`).join('');
}
})();
</script>
</body>
</html>
